spec:
  inputs:
    sonar-quality-gate-enabled:
      description: 'Enables SonarQube [Quality Gate](https://docs.sonarsource.com/sonarqube-server/latest/quality-standards-administration/managing-quality-gates/introduction/) verification.'
      type: boolean
      default: false

---
# prevent duplicate pipelines
# https://docs.gitlab.com/ci/jobs/job_rules/#avoid-duplicate-pipelines
# https://docs.gitlab.com/ci/yaml/workflow/#switch-between-branch-pipelines-and-merge-request-pipelines
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - build
  - test
  - deploy
  - publish
  - sign

include:
  - component: "$CI_SERVER_FQDN/zeta/zeta-ci-cd-components/container-scanning@v1.2.1"
    inputs:
      job-name: "container-scanning-ngx_pep"
      cs-image: "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
      git-strategy: fetch
      severity: HIGH,CRITICAL
      job-stage: test
      trivyignore-file: "trivy/.ngx_pep.trivyignore"
      openvex-file: ".vex/ngx_pep-vulnerabilites.openvex.json"
  - component: "$CI_SERVER_FQDN/zeta/zeta-ci-cd-components/container-scanning@v1.2.1"
    inputs:
      job-name: "container-scanning-ngx_ingress"
      cs-image: "$CI_REGISTRY_IMAGE/nginx-ingress:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
      git-strategy: fetch
      severity: HIGH,CRITICAL
      job-stage: test
      trivyignore-file: "trivy/.ngx_ingress.trivyignore"
      openvex-file: ".vex/ngx_ingress-vulnerabilites.openvex.json"

  - component: $CI_SERVER_FQDN/zeta/zeta-ci-cd-components/container-signing@v1.2.0
    inputs:
      image-to-sign: "$TAGGED_IMAGE_INGRESS"
      job-name: container-signing-ingress
      job-dependencies: [ tag_image ]
      job-stage: sign
    # Keep in sync with tag_image's rules
    rules:
      - if: $CI_PIPELINE_SOURCE == "schedule"
        when: never
      - if: $CI_COMMIT_TAG
      - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      - when: never

  - component: $CI_SERVER_FQDN/zeta/zeta-ci-cd-components/container-signing@v1.2.0
    inputs:
      image-to-sign: "$TAGGED_IMAGE_HSM_SIM"
      job-name: container-signing-hsm-sim
      job-dependencies: [ tag_image ]
      job-stage: sign
    # Keep in sync with tag_image's rules
    rules:
      - if: $CI_PIPELINE_SOURCE == "schedule"
        when: never
      - if: $CI_COMMIT_TAG
      - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      - when: never

  - component: $CI_SERVER_FQDN/zeta/zeta-ci-cd-components/container-signing@v1.2.0
    inputs:
      image-to-sign: "$TAGGED_IMAGE"
      job-name: container-signing-pep
      job-dependencies: [ tag_image ]
      job-stage: sign
    # Keep in sync with tag_image's rules
    rules:
      - if: $CI_PIPELINE_SOURCE == "schedule"
        when: never
      - if: $CI_COMMIT_TAG
      - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      - when: never

default:
  # Don't bump beyond 29.0 before we got the fix for https://gitlab.com/gitlab-org/gitlab/-/work_items/581900
  image: $CI_REGISTRY/zeta/devops/ci-images/docker:29.0.4-zeta-0
  tags: [ zeta ]
  services:
    - name: $CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX/docker:29.0.4-dind
      alias: docker
      variables:
        HEALTHCHECK_TCP_PORT: "2376"

variables:
  DOCKER_BUILDKIT: "1"
  BUILDX_BUILDER: "ci-builder"
  BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: /certs
  DOCKER_CERT_PATH: $DOCKER_TLS_CERTDIR/client
  DOCKER_TLS_VERIFY: "1"
  EXT_IMAGE_PREFIX: $CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX/
  TAGS: $CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA,$CI_COMMIT_REF_SLUG-latest
  CACHE: true
  SCCACHE: true
  ARTIFACTS: true

before_script:
  - docker context create docker
  - printf "%s" "$CI_DEPENDENCY_PROXY_PASSWORD" | docker login "$CI_DEPENDENCY_PROXY_SERVER" -u "$CI_DEPENDENCY_PROXY_USER" --password-stdin
  - printf "%s" "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  - docker buildx create --name ci-builder --use --driver docker-container --driver-opt image="$CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX/moby/buildkit:buildx-stable-1" docker
  - docker buildx use ci-builder
  - |
    for i in $(seq 5); do
      if docker buildx inspect --bootstrap --builder ci-builder >/dev/null; then
        break
      fi
      if [[ $i == 5 ]]; then
        printf "Unable to bootstrap builder\n"
        exit 1
      fi
      sleep 1
    done

base:
  stage: build
  rules:
    # don't rebuild for nightly build, keep scanning the last-built image
    - if: '$CI_PIPELINE_SOURCE != "schedule"'
      when: always
  script:
    - |
      printf "Build base…\n"
      . build.env
      docker bake \
        --push \
        base

build:pep-build:
  stage: build
  rules:
    # don't rebuild for nightly build, keep scanning the last-built image
    - if: '$CI_PIPELINE_SOURCE != "schedule"'
      when: on_success
  needs:
  - job: base
  variables:
    REF_BUILD_ENV: docker-image://$CI_REGISTRY_IMAGE/build-env:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
  script:
    - |
      IT_P12=$(mktemp -p "$PWD")
      export IT_P12
      base64 -d "$IT_P12_B64" > "$IT_P12"

      mkdir -p ./artifacts

      . build.env
      docker bake \
        --push \
        pep-build 

  artifacts:
    when: always
    paths:
      - ./artifacts

build:aux-build:
  stage: build
  rules:
    # don't rebuild for nightly build, keep scanning the last-built image
    - if: '$CI_PIPELINE_SOURCE != "schedule"'
      when: on_success
  needs:
  - job: base
  variables:
    REF_BUILD_ENV: docker-image://$CI_REGISTRY_IMAGE/build-env:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
    ARTIFACTS: true
  script:
    - |
      . build.env
      docker bake \
        --push \
        aux-build

package:
  stage: build
  rules:
    # don't rebuild for nightly build, keep scanning the last-built image
    - if: '$CI_PIPELINE_SOURCE != "schedule"'
      when: on_success
  needs:
  - job: build:pep-build
  - job: build:aux-build
  variables:
    REF_PEP_BASE: docker-image://$CI_REGISTRY_IMAGE/pep-base:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
    REF_NGINX_INGRESS_BASE: docker-image://$CI_REGISTRY_IMAGE/nginx-ingress-base:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
    REF_PEP_BUILD: docker-image://$CI_REGISTRY_IMAGE/pep-build:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
    REF_HEADERS_MORE: docker-image://$CI_REGISTRY_IMAGE/headers-more:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA

  script:
    - |
      printf "!! cloning zeta-test-certificates (load_dispenser)\n\n"
      git clone --depth=1 https://gitlab-ci-token:$CI_JOB_TOKEN@$CI_SERVER_FQDN/zeta/testing/zeta-test-certificates.git
      ln -sf zeta-test-certificates/keystores keystores

      . build.env
      docker bake \
        --push \
        package \
        load-dispenser

sonarqube:
  stage: build
  # see https://docs.sonarsource.com/sonarqube-server/analyzing-source-code/languages/rust
  before_script: [ ]
  cache:
    - key: "${CI_JOB_NAME}"
      paths:
        - "${CI_PROJECT_DIR}/.sonar/cache"
  image:
    name: $CI_REGISTRY_IMAGE/build-env:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
  needs:
    - job: build:pep-build
      artifacts: true
  script:
    - >-
      sonar-scanner
      ${TRACE+-Dsonar.verbose=true}
      ${SONAR_QUALITY_GATE_ENABLED:+-Dsonar.qualitygate.wait=$SONAR_QUALITY_GATE_ENABLED}
      -Dsonar.projectVersion="$(cat .pkg-version)"
      -Dsonar.links.homepage=${CI_PROJECT_URL}
      -Dsonar.links.ci=${CI_PROJECT_URL}/-/pipelines
      -Dsonar.links.issue=${CI_PROJECT_URL}/-/issues
  rules:
    - if: '($SONAR_HOST_URL == null || $SONAR_HOST_URL == "")'
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
    GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
    SONAR_QUALITY_GATE_ENABLED: $[[ inputs.sonar-quality-gate-enabled ]]
    # TRACE: "1"

trigger_helm:
  stage: deploy
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - when: never
  trigger:
    project: zeta/devops/zeta-guard-helm
    # release branch: smoke-test against the release chart, not main — main's chart
    # renders pep_pdp_url, which images from this branch deliberately do not support
    branch: releases/1.3.x
    strategy: depend
  variables:
    PEPPROXY_IMAGE_TAG: "$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA" # e.g. main-cafebabe

tag_image:
  stage: publish
  rules:
    # don't trigger for nightly builds — they are supposed to check dependency issues in
    # *previously* built and released images, and not build/tag anything themselves.
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_TAG
      variables:
        TARGET_TAG: "$CI_COMMIT_TAG"
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        TARGET_TAG: "$CI_DEFAULT_BRANCH"
      when: on_success
    - when: never
  needs:
    - job: package
      optional: true # resolved before rules are evaluated, which fails when schedule
    - job: trigger_helm
      optional: true
  variables:
    SOURCE_TAG: $CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
    IMAGE_PEP: $CI_REGISTRY_IMAGE
    IMAGE_NGINX_INGRESS: $CI_REGISTRY_IMAGE/nginx-ingress
    IMAGE_HSM_SIM: $CI_REGISTRY_IMAGE/hsm_sim
    IMAGE_LOAD_DISPENSER: $CI_REGISTRY_IMAGE/load-dispenser
  script:
    - |
      for image in "$IMAGE_PEP" "$IMAGE_NGINX_INGRESS" "$IMAGE_HSM_SIM" "$IMAGE_LOAD_DISPENSER"; do
        src="$image:$SOURCE_TAG"
        tgt="$image:$TARGET_TAG"
        printf "\n%s → %s\n\n" "$src" "$tgt"
        docker pull "$src"
        docker tag "$src" "$tgt"
        docker push "$tgt"
      done

      # expose the tagged image refs to the container-signing jobs
      {
        echo "TAGGED_IMAGE=$IMAGE_PEP:$TARGET_TAG"
        echo "TAGGED_IMAGE_INGRESS=$IMAGE_NGINX_INGRESS:$TARGET_TAG"
        echo "TAGGED_IMAGE_HSM_SIM=$IMAGE_HSM_SIM:$TARGET_TAG"
        echo "TAGGED_IMAGE_LOAD_DISPENSER=$IMAGE_LOAD_DISPENSER:$TARGET_TAG"
      } > tag_image.env
  artifacts:
    reports:
      dotenv: tag_image.env

publish_artifacts:
  stage: publish
  rules:
    - if: $CI_COMMIT_TAG
      variables:
        COMMIT_MESSAGE: "$CI_COMMIT_TAG"
      when: on_success
    - if: $CI_COMMIT_BRANCH == "staging"
      variables:
        COMMIT_MESSAGE: "staging $CI_COMMIT_SHORT_SHA"
      when: on_success
    - if: $CI_COMMIT_BRANCH == "release"
      variables:
        COMMIT_MESSAGE: "release $CI_COMMIT_SHORT_SHA"
      when: on_success
    - when: never
  needs:
    - job: package
      artifacts: true
    - job: container-scanning-ngx_pep
      artifacts: true
    - job: container-scanning-ngx_ingress
      artifacts: true
  script:
    - git clone https://zeta-sdk:${REPORTING_TOKEN}@tas-devtools-gitlab.spree.de/zeta/reporting.git
    - mkdir -p ./reporting/zeta-guard/ngx_pep/
    - find . -path ./reporting -prune -o -name 'ngx_pep.cdx.json' -exec cp --parents '{}' ./reporting/zeta-guard/ngx_pep/ \;
    - find . -path ./reporting -prune -o -name 'coverage.lcov' -exec cp --parents '{}' ./reporting/zeta-guard/ngx_pep/ \;
    - find . -path ./reporting -prune -o -name 'gl-container-scanning-report.json' -exec cp --parents '{}' ./reporting/zeta-guard/ngx_pep/ \;
    - cd reporting
    - git config user.email "ci@tas-devtools-gitlab.spree.de"
    - git config  user.name "ci"
    - git add .
    - git commit -m "$COMMIT_MESSAGE"
    - git push

publish_to_dependencytrack:
  image: alpine/curl:8.17.0
  stage: publish
  rules:
    - if: $CI_COMMIT_TAG
      variables:
        VERSION: "$CI_COMMIT_TAG"
      when: on_success
    - if: $CI_COMMIT_BRANCH == "staging"
      variables:
        VERSION: "staging $CI_COMMIT_SHORT_SHA"
      when: on_success
    - if: $CI_COMMIT_BRANCH == "release"
      variables:
        VERSION: "release $CI_COMMIT_SHORT_SHA"
      when: on_success
    - if: $CI_MERGE_REQUEST_ID
      variables:
        VERSION: "MR $CI_MERGE_REQUEST_ID"
      when: on_success
    - when: never
  needs:
    - job: build:pep-build
      artifacts: true
  before_script: []
  script:
    - >-
      curl -X POST https://tas-devtools-dependencytrack.westeurope.azurecontainer.io/api/v1/bom
      -H "Content-Type: multipart/form-data"
      -H "X-API-Key: ${DEPENDENCYTRACK_TOKEN}"
      -F "projectName=ngx_pep"
      -F "projectVersion=${VERSION}"
      -F "autoCreate=true"
      -F "bom=@./artifacts/ngx_pep.cdx.json"
