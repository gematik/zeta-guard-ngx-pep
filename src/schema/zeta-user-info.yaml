# Schema for the user-info JSON object.
# The PDP authorization server stores user-info records for all authenticated
# user.
# The PEP can request user-info records for a user by sending a request.
#
$schema: "http://json-schema.org/draft-07/schema#"
title: zeta user info
description: Schema for the zeta_user_info JSON object.
type: object
properties:
  identifier:
    type: string
    description: "Telematik-ID, KVNR or other unique identifier"
  professionOID:
    type: string
    description: "Profession identifier (OID)"
  commonName:
    type: string
    description: "Kurzname der Institution"
  organizationName:
    type: string
    description: "Name der Organisation oder Institution"
  # HOTFIX ANFTI2-922 / A_27558: taken verbatim from the upstream gematik/zeta schema, so
  # `birthdate` stays optional here. `format: date` makes typify generate a
  # `chrono::NaiveDate`; `pattern` is kept for spec fidelity only — typify prefers `format`
  # and never emits a pattern check for it. The PEP fills the field for insurant tokens
  # (professionOID 1.2.276.0.76.4.49, see `user_info_from_claims`), because DiPag rejects
  # requests without it; other client types get no birthdate.
  birthdate:
    type: string
    format: date
    pattern: '^\d{4}-\d{2}-\d{2}$'
    description: >-
      Geburtsdatum des Versicherten (YYYY-MM-DD, ISO 8601 / OpenID Connect
      Core 5.1). Optional und consent-abhängig: aus dem id_token-Claim
      'birthdate' übernommen, sofern der Nutzer am sektoralen IDP der Freigabe
      zugestimmt hat (siehe A_26973-02). Fehlt das Feld, wenn kein Consent
      vorliegt.
required:
  - identifier
  - professionOID
  - commonName
