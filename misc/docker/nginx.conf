include main_modules.conf;
include main_common.conf;

user nginx;
worker_processes auto;

error_log /dev/stdout;
pid /tmp/nginx.pid;

events {
    worker_connections 16384;
    multi_accept on;
    use epoll;
}

http {
    include http_common.conf;

    access_log /dev/stdout main;

    client_body_temp_path /tmp/client_body_temp;
    proxy_temp_path /tmp/proxy_temp;
    scgi_temp_path /tmp/scgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;

    ### Global Config

    pep_pdp_issuer https://zeta-staging.spree.de/auth/realms/zeta-guard;
    ## optional internal address used only to reach the PDP for OIDC discovery and
    ## the JWKS fetch, keeping that traffic off the public path. Must mirror the
    ## issuer's path structure; pep_pdp_issuer stays the expected `iss`.
    # pep_pdp_url http://authserver/auth/realms/zeta-guard;
    ## server hosting PoPP entity statement at /.well-known/openid-federation
    ## optional if no locations use pep_require_popp
    # pep_popp_issuer https://example.org;
    ## upper bound for how long fetched PDP/PoPP keys and discovery documents are used
    ## before they are fetched again in full, whatever max-age the server sent and
    ## however often it answered 304 since
    # pep_jwks_max_lifetime 24h;
    # pep_http_client_connect_timeout 2; # s
    # pep_http_client_timeout 10; # s
    # pep_http_client_accept_invalid_certs off;
    ## enable or disable no-travel enforcement (ip address consistency)
    # pep_no_travel off;
    ## NOTE: acquire aslkeys and enable these settings if you need ASL support
    ## NOTE: you must also include asl.conf in server below!
    # pep_asl_testing on;
    # pep_asl_signer_cert /etc/nginx/signer_cert.pem;
    # pep_asl_signer_key /etc/nginx/signer_key.pem;
    # pep_asl_ca_cert /etc/nginx/issuer_cert.pem;
    # pep_asl_roots_json /etc/nginx/roots.json;
    # pep_asl_root_ca FAKE.RCA1;
    ## cert: use AuthorityInformationAccess (AIA) from cert (default)
    ## off: disable OCSP checks
    ## https://ocsp.example.org: override responder, ignore cert AIA
    # pep_asl_ocsp_url cert;
    # pep_asl_ocsp_ttl 24h;
    ## ASL session cache: a shared memory zone per nginx instance (i.e. per pod; with
    ## replicaCount > 1 every pod has its own cache, clients must stick to the pod they
    ## handshook with). Roughly 300-500 bytes per entry: 100m hold ~200-300k sessions.
    ## When the zone is full, expired entries are dropped, then the oldest are evicted;
    ## watch zeta.asl.session_cache.used/size and ...alloc_failures.
    ## size of the zone, default: 100m (min 1m, max 16g).
    ## The ASL certificates, roots and testing flag are read when the zone is created: a reload
    ## keeps the zone, its sessions and these settings, unless the size changed, in which case
    ## the cache starts over empty. The TTLs below and the OCSP settings are applied on reload.
    # pep_asl_session_cache_size 100m;
    ## lifetime of an established session, default: 24h (unit suffix d/h/m/s, default m);
    ## capped at the 24h the ASL protocol allows
    # pep_asl_session_ttl 24h;
    ## lifetime of an unfinished handshake, default: 5m (unit suffix d/h/m/s, default m)
    # pep_asl_handshake_ttl 5m;

    ### Location Config
    ## These can be set per-location, but it is recommended to set them once globally, and
    ## only override in specific locations as needed.

    ## enable access phase handler to check access tokens, DPoP and, optionally, PoPP
    pep on;
    ## space separated list of required audiences
    pep_require_aud "https://zeta-staging.spree.de";
    ## space separated list of required scopes
    # pep_require_scope "openid profile email";
    ## clock leeway when checking exp,nbf,iat claims in s, default: 60
    ## used for access token, DPoP, and PoPP checks
    # pep_leeway 60;
    ## implied dpop validity in s: iat + pep_dpop_validity + pep_leeway
    ## pep_dpop_validity 300;
    ## validate PoPP header and pass decoded claims as ZETA-PoPP-Token-Content to upstream
    # pep_require_popp off;
    ## validity period of popp tokens, either quarter (default) or a fixed duration.
    ## quarter: within the current quarter (see gemSpec_ZETA — A_26477), e.g.:
    ##   pep_popp_validity quarter;
    ## number: duration since iat, e.g.:
    ##   pep_popp_validity 1d; # d h m s
    ## or:
    ##   pep_popp_validity 86400; # defaults to s if no unit given
    ## in both cases, pep_leeway is added
    pep_popp_validity quarter;
    ## forward client data to upstream
    # pep_forward_client_data off;
    ## A_25669-01: forward the full access token payload as ZETA-Access-Token-Content
    # pep_forward_access_token_content off;

    server {
        include server_common.conf; # must be the first directive in each server block

        listen 8080;
        # listen 8443 ssl;
        # ssl_certificate "tls.p256.pem";
        ## NOTE: set HSM_PROXY_ADDR="https://hsm:50051" environment variable to use
        ## store:hsm with the ossl_hsm provider; HSM_PROXY_CA=/path/to/ca.pem if the
        ## proxy's certificate is not issued by a CA in the system trust store;
        ## HSM_PROXY_CLIENT_CERT/HSM_PROXY_CLIENT_KEY to authenticate to the proxy
        # ssl_certificate_key "store:hsm:tls.p256";

        server_name localhost;

        root /usr/share/nginx/html;

        ## These headers are stripped on upstreams by default for security reasons.
        ## If the information in the ZETA- custom headers is not enough, you can set 0
        ## here to retain the full tokens instead.
        ## Can also be set per-location, but *must* be before
        ## `include proxy_headers.conf;`
        # set $zeta_strip_authorization 0;
        # set $zeta_strip_dpop 0;
        # set $zeta_strip_popp 0;

        ## optional, when using ASL
        # include asl.conf;

        ## NOTE: configure your Fachdienst-URLS here
        # upstream fachdienst {
        #     server example.com:80 max_fails=1 fail_timeout=10s;
        #     ## reuse connections instead of opening one per request (TIME_WAIT budget)
        #     keepalive 32;
        # }
        #
        # location / {
        #   proxy_pass http://fachdienst/;
        #   include proxy_headers.conf;
        #   proxy_http_version 1.1;
        #   proxy_set_header Host example.com;
        #   ## required for upstream keepalive
        #   proxy_http_version 1.1;
        #   proxy_set_header Connection "";
        #   ## SNI for pooled TLS upstream connections
        #   proxy_ssl_server_name on;
        #   proxy_ssl_name testfachdienst;
        # }
        #
        # location = /ws {
        #     proxy_pass http://fachdienst/ws;
        #     include proxy_headers.conf;
        #     proxy_set_header Host example.com;
        #     ## required for upstream keepalive (and for WebSocket upgrades)
        #     proxy_http_version 1.1;
        #     ## hop-by-hop upgrade (see http_common.conf)
        #     proxy_set_header Upgrade $http_upgrade;
        #     proxy_set_header Connection $connection_upgrade;
        #     proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        #     ## SNI for pooled TLS upstream connections
        #     proxy_ssl_server_name on;
        #     proxy_ssl_name testfachdienst;
        #     ## SECURITY: publicly reachable WITHOUT the ASL protocol (which does not support ws)
        #     satisfy all;
        #     allow all;
        # }
        #
        # location /ws/ {
        #     proxy_pass http://fachdienst/ws/;
        #     include proxy_headers.conf;
        #     proxy_set_header Host example.com;
        #     ## required for upstream keepalive (and for WebSocket upgrades)
        #     proxy_http_version 1.1;
        #     ## hop-by-hop upgrade (see http_common.conf)
        #     proxy_set_header Upgrade $http_upgrade;
        #     proxy_set_header Connection $connection_upgrade;
        #     proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        #     ## SNI for pooled TLS upstream connections
        #     proxy_ssl_server_name on;
        #     proxy_ssl_name testfachdienst;
        #     ## SECURITY: publicly reachable WITHOUT the ASL protocol (which does not support ws)
        #     satisfy all;
        #     allow all;
        # }
    }
}
