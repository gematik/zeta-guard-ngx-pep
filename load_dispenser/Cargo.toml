[package]
name = "load_dispenser"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "signal"] }
tokio-util = "0.7"
tonic = "0.14"
tonic-prost = "0.14"
tonic-reflection = "0.14"
tonic-health = "0.14"
prost = "0.14"
prost-types = "0.14"
reqwest = { version = "^0.13", features = ["rustls", "json", "cookies"] }
ngx_pep = { path="..", features=["client"]}
base64ct = "1.8"
async-walkdir = "2.1"
futures = "0.3"
anyhow = "1"
indicatif = "0.18"
http = "1.4"
governor = "0.10"
rand = "0.10"
config = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
fastrand = "2.3"
hdrhistogram = "7"

[build-dependencies]
tonic-prost-build = "0.14"
